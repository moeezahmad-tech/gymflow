<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />

  <!-- Subtle Inner Border Accent -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#redGrad)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Dumbbell / Weight Icon with Dynamic Glow -->
  <g filter="url(#glow)">
    <!-- Barbell Center Bar -->
    <rect x="18" y="29.5" width="28" height="5" rx="2" fill="#f4f4f5" />

    <!-- Center Grip Knurling -->
    <line x1="28" y1="30" x2="28" y2="34" stroke="#71717a" stroke-width="1.2" />
    <line x1="32" y1="30" x2="32" y2="34" stroke="#71717a" stroke-width="1.2" />
    <line x1="36" y1="30" x2="36" y2="34" stroke="#71717a" stroke-width="1.2" />

    <!-- Left Outer Weight Plate -->
    <rect x="11" y="20" width="4" height="24" rx="2" fill="url(#redGrad)" />
    <!-- Left Inner Weight Plate -->
    <rect x="16" y="23" width="3.5" height="18" rx="1.5" fill="url(#redGrad)" />

    <!-- Right Inner Weight Plate -->
    <rect x="44.5" y="23" width="3.5" height="18" rx="1.5" fill="url(#redGrad)" />
    <!-- Right Outer Weight Plate -->
    <rect x="49" y="20" width="4" height="24" rx="2" fill="url(#redGrad)" />

    <!-- Left Plate Highlight -->
    <rect x="12" y="22" width="1.2" height="20" rx="0.6" fill="#ffffff" fill-opacity="0.6" />
    <!-- Right Plate Highlight -->
    <rect x="50" y="22" width="1.2" height="20" rx="0.6" fill="#ffffff" fill-opacity="0.6" />

    <!-- Energy Flash / Spark at Center -->
    <polygon points="32,15 34,22 38,24 34,26 32,33 30,26 26,24 30,22" fill="#ef4444" opacity="0.8" />
  </g>
</svg>
